script:
  # Sets target_brightness; the 40 ms interval fades to it. Without force, auto brightness ignores changes
  # smaller than 8 steps so light-sensor noise and passing clouds do not make the panel pulse.
  - id: apply_brightness
    mode: restart
    parameters:
      force: bool
    then:
      - lambda: |-
          if (!id(display_on).state) {
            id(target_brightness) = 0;
            return;
          }
          int b;
          auto now = id(ha_time).now();
          int start = (int) id(night_start).state, end = (int) id(night_end).state;
          bool night = id(night_mode).state && now.is_valid() && clock_util::in_hours(now.hour, start, end);
          if (night) {
            b = (int) id(night_brightness).state;
          } else if (!id(auto_brightness).state || !id(ambient_light).has_state()) {
            b = (int) id(brightness).state;
          } else {
            float lo = id(brightness_min).state, hi = id(brightness_max).state;
            b = (int) (lo + (hi - lo) * id(ambient_light).state / 100.0f);
            if (!force && std::abs(b - id(target_brightness)) < 8) return;
          }
          id(target_brightness) = b;
  # Rings a stock tone over and over for "Alarm duration" and scrolls "Báo thức HH:MM"
  - id: ring_alarm
    parameters:
      tone: int
    then:
      - lambda: |-
          id(alarm_tone) = tone;
          id(alarm_start) = millis();
          id(alarm_ringing) = true;
      - text.set:
          id: message_text
          value: !lambda 'return id(ha_time).now().strftime("Báo thức %H:%M");'
      - script.execute: alarm_loop
  # Replays from a script: rtttl.play inside on_finished_playback is cut off by rtttl's own cleanup.
  # stop_alarm only clears alarm_ringing and the sound; the loop then ends by itself.
  - id: alarm_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(alarm_ringing) && millis() - id(alarm_start) < id(alarm_duration).state * 1000;"
          then:
            - rtttl.play: !lambda "return clock_util::alarm_tone(id(alarm_tone));"
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
      - script.execute: stop_alarm
  - id: stop_alarm
    then:
      - if:
          condition:
            lambda: return id(alarm_ringing);
          then:
            - lambda: |-
                id(alarm_ringing) = false;
                id(rtttl_player).stop();
            - text.set:
                id: message_text
                value: ""

# ---- Sensors -------------------------------------------------------------

sensor:
  - platform: debug
    free:
      name: "Heap free"
      entity_category: diagnostic
    block:
      name: "Heap largest block"
      entity_category: diagnostic
    min_free:
      name: "Heap min free"
      entity_category: diagnostic
  # NTC 5k@25C to GND with pull-up to 3.3V (Steinhart-Hart coefficients from the stock firmware).
  # The stock code uses 20000 as the divider constant, but 10k matches the room temperature.
  - platform: adc
    id: ntc_voltage
    pin: GPIO35
    attenuation: 12db
    update_interval: 10s
    internal: true
  - platform: resistance
    id: ntc_resistance
    sensor: ntc_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V
    internal: true
  - platform: ntc
    sensor: ntc_resistance
    id: temperature
    name: "Temperature"
    calibration:
      - 9643Ohm -> 10°C
      - 5000Ohm -> 25°C
      - 2674Ohm -> 40°C
    filters:
      - sliding_window_moving_average:
          window_size: 6
          send_every: 3

  # CDS photoresistor. The stock firmware maps (4095 - raw), so a lower voltage means more light.
  - platform: adc
    id: ldr_voltage
    name: "Light sensor voltage"
    pin: GPIO34
    attenuation: 12db
    update_interval: 2s
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - delta: 0.01
  - platform: template
    id: ambient_light
    name: "Ambient light"
    unit_of_measurement: "%"
    icon: mdi:brightness-5
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (!id(ldr_voltage).has_state()) return {};
      return clamp((1.0f - id(ldr_voltage).state / 3.1f) * 100.0f, 0.0f, 100.0f);
    filters:
      # 30 s average: the CDS reading wanders by a few percent even in steady light
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1
      - delta: 2
    on_value:
      - if:
          condition:
            switch.is_on: auto_brightness
          then:
            - script.execute:
                id: apply_brightness
                force: false

  - platform: template
    id: display_brightness
    name: "Display brightness"
    icon: mdi:brightness-percent
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    lambda: return id(applied_brightness);

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  # Data from Home Assistant for the bottom pages
  - platform: homeassistant
    id: ha_pm_in
    entity_id: ${pm_in_entity}
    internal: true
  - platform: homeassistant
    id: ha_co2
    entity_id: ${co2_entity}
    internal: true
  - platform: homeassistant
    id: ha_temp
    entity_id: ${temp_entity}
    internal: true
  - platform: homeassistant
    id: ha_hum
    entity_id: ${hum_entity}
    internal: true

# DHT21 (AM2301) on the empty SEN header, GPIO32. Uncomment if a sensor is fitted.
#  - platform: dht
#    pin: GPIO32
#    model: AM2301
#    temperature:
#      name: "DHT temperature"
#    humidity:
#      name: "Humidity"
#    update_interval: 30s

# Reset reason, to tell crashes from clean restarts after an OTA, and heap headroom (see bit_depth)
debug:
  update_interval: 60s

text_sensor:
  # ESPHome version with the build time, to confirm which firmware is running
  - platform: version
    name: "Firmware"
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Reset reason"
      entity_category: diagnostic
  # Time stored in the RTC (shown in local time), or why it can't be used
  - platform: template
    id: rtc_time
    name: "RTC time"
    icon: mdi:clock-check-outline
    update_interval: 10min
    entity_category: diagnostic
    lambda: |-
      ESPTime t;
      bool lost, low_voltage;
      if (!id(rtc).read_rtc(t, lost, low_voltage)) return std::string("I2C error");
      if (lost) return std::string("Time lost");
      if (!t.is_valid()) return std::string("Invalid");
      return ESPTime::from_epoch_local(t.timestamp).strftime("%Y-%m-%d %H:%M:%S");
  - platform: template
    name: "Lunar date"
    icon: mdi:calendar-month
    update_interval: 60s
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid()) return {};
      auto l = amlich::solar_to_lunar(now.day_of_month, now.month, now.year);
      char buf[64];
      snprintf(buf, sizeof(buf), "%d/%d%s %s %s", l.day, l.month, l.leap ? " (nhuận)" : "",
               amlich::can(l.year), amlich::chi(l.year));
      return std::string(buf);
  - platform: template
    id: event_text
    name: "Today event"
    icon: mdi:calendar-star
    update_interval: never

# ---- Buzzer and button ---------------------------------------------------

output:
  # Passive buzzer: the stock firmware drives it with ledcAttachPin(25) + ledcWriteTone
  - platform: ledc
    pin: GPIO25
    id: buzzer_out
  # GPIO33: the stock firmware toggles it once a second (heartbeat LED)
  - platform: gpio
    pin: GPIO33
    id: led_out

light:
  - platform: binary
    name: "Status LED"
    output: led_out
    restore_mode: ALWAYS_OFF
    entity_category: config

rtttl:
  id: rtttl_player
  output: buzzer_out
  gain: 60%

button:
  - platform: template
    name: "Beep"
    icon: mdi:bullhorn
    on_press:
      - rtttl.play: "beep:d=16,o=6,b=200:c,p,c"
  # Plays the "Cho con" melody once (KEY stops it)
  - platform: template
    name: "Play Cho con"
    icon: mdi:music
    on_press:
      - rtttl.play: !lambda "return clock_util::CHO_CON;"
  - platform: template
    name: "Stop alarm"
    icon: mdi:alarm-off
    on_press:
      - script.execute: stop_alarm
  - platform: restart
    name: "Restart"
    entity_category: config

binary_sensor:
  # KEY is on GPIO0 (also the boot strap: hold it at power-on for download mode).
  # Press: stop an alarm or a sound, else clear a message, else toggle the display.
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    name: "Button"
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: return id(alarm_ringing);
          then:
            - script.execute: stop_alarm
          else:
            - if:
                condition:
                  rtttl.is_playing:
                then:
                  - rtttl.stop:
                else:
                  - if:
                      condition:
                        lambda: return !id(message_text).state.empty();
                      then:
                        - text.set:
                            id: message_text
                            value: ""
                      else:
                        - switch.toggle: display_on
  # On while an alarm rings
  - platform: template
    name: "Alarm ringing"
    icon: mdi:alarm-light
    lambda: return id(alarm_ringing);
